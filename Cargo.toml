[package]
name = "kubefs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bimap = "0.6.3"
clap = { version = "4.6.6", features = ["derive"] }
fuser = "0.18.0"
itertools = "0.15.0"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = "4.2.0"
libc = "0.2.189"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
